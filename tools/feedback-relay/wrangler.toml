# Cloudflare Worker config for the feedback relay (see README.md).
name = "isola-feedback"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
# a PRIVATE repository: feedback must never land in the public tracker
FEEDBACK_REPO = "Scriptily/isola-feedback"

[[kv_namespaces]]
binding = "FEEDBACK"
# from `npx wrangler kv namespace create FEEDBACK` (an ID, not a secret)
id = "REPLACE_WITH_KV_NAMESPACE_ID"
