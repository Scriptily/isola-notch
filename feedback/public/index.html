<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Feedback Hub</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" aria-label="Feedback Hub, inbox">
      <span class="pill" aria-hidden="true"><i></i><i></i><b></b></span>
      <span class="brand-name">Feedback <span>Hub</span></span>
    </a>
    <label class="search">
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Search reports, #number or user" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>
    <div class="top-right">
      <button class="btn ghost" id="refresh" title="Refresh (R)"><svg class="ico"><use href="#i-refresh"/></svg></button>
      <div class="menu-wrap">
        <button class="btn ghost" id="export-btn" aria-haspopup="menu" aria-expanded="false"><svg class="ico"><use href="#i-download"/></svg><span>Export</span></button>
        <div class="menu" id="export-menu" role="menu" hidden>
          <a role="menuitem" href="/api/export?format=csv">CSV</a>
          <a role="menuitem" href="/api/export?format=json">JSON</a>
        </div>
      </div>
      <span class="who" id="who"></span>
    </div>
  </header>

  <div class="shell">
    <nav class="side" id="side" aria-label="Views"></nav>

    <main class="main">
      <section class="stats" id="stats" aria-label="Overview"></section>
      <div class="toolbar">
        <div class="seg" id="status-seg" role="tablist" aria-label="Status">
          <button role="tab" data-status="open">Open</button>
          <button role="tab" data-status="closed">Closed</button>
          <button role="tab" data-status="all">All</button>
          <span class="seg-thumb" aria-hidden="true"></span>
        </div>
        <div class="filters" id="active-filters"></div>
        <div class="spacer"></div>
        <div class="bulk" id="bulk" hidden>
          <span id="bulk-count"></span>
          <button class="btn" data-bulk="closed"><svg class="ico"><use href="#i-check-circle"/></svg>Close</button>
          <button class="btn" data-bulk="open"><svg class="ico"><use href="#i-dot-circle"/></svg>Reopen</button>
        </div>
        <label class="select">
          <span>Sort</span>
          <select id="sort">
            <option value="new">Newest</option>
            <option value="old">Oldest</option>
            <option value="updated">Recently updated</option>
            <option value="user">By user</option>
          </select>
        </label>
      </div>
      <div class="list-head">
        <label class="check" title="Select all"><input type="checkbox" id="select-all"><span></span></label>
        <span id="count"></span>
        <span class="keys"><kbd>J</kbd><kbd>K</kbd> move <kbd>X</kbd> close or reopen <kbd>?</kbd> shortcuts</span>
      </div>
      <div class="list" id="list" role="listbox" aria-label="Reports" tabindex="0"></div>
    </main>

    <aside class="detail" id="detail" aria-label="Report" hidden></aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="help" id="help">
    <h2>Keyboard shortcuts</h2>
    <dl>
      <dt><kbd>J</kbd> <kbd>K</kbd></dt><dd>Next and previous report</dd>
      <dt><kbd>Enter</kbd></dt><dd>Open the selected report</dd>
      <dt><kbd>X</kbd></dt><dd>Close or reopen it</dd>
      <dt><kbd>Space</kbd></dt><dd>Select it for a bulk action</dd>
      <dt><kbd>T</kbd></dt><dd>Add a tag</dd>
      <dt><kbd>N</kbd></dt><dd>Write a note</dd>
      <dt><kbd>/</kbd></dt><dd>Search</dd>
      <dt><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></dt><dd>Open, closed, all</dd>
      <dt><kbd>R</kbd></dt><dd>Refresh</dd>
      <dt><kbd>Esc</kbd></dt><dd>Close the report or this list</dd>
    </dl>
    <form method="dialog"><button class="btn">Done</button></form>
  </dialog>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13.5 6.5 5h11l2.5 8.5V19H4z"/><path d="M4 13.5h4.5l1.5 2.5h4l1.5-2.5H20"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 8 4.5-8 4.5-8-4.5z"/><path d="m4 13 8 4.5 8-4.5"/></symbol>
      <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8.5 12.2 2.3 2.3 4.7-4.8"/></symbol>
      <symbol id="i-dot-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-bug" viewBox="0 0 24 24"><rect x="7.5" y="8" width="9" height="11" rx="4.5"/><path d="M12 11v8M9.5 5.5 10.5 8M14.5 5.5 13.5 8M4.5 12h3M16.5 12h3M5.5 17.5l2.5-1M18.5 17.5l-2.5-1M5.5 7.5l2.5 1.5M18.5 7.5 16 9"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 4.5 13.6 10.4 19.5 12l-5.9 1.6L12 19.5l-1.6-5.9L4.5 12l5.9-1.6z"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5v4h4M9.5 12h5M9.5 15.5h5"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4 4.5h7.5l8 8-7 7-8-8z"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.2-3.3 3.8-5 7-5s5.8 1.7 7 5"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 5.5h14v10l-4 4H5z"/><path d="M15 19.5v-4h4M8.5 9.5h7M8.5 12.5h4"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5A2 2 0 0 0 13.5 4.5h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5.5 12.5 4 4 9-9"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
      <symbol id="i-window" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 9h17"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
    </defs>
  </svg>
  <script type="module" src="app.js"></script>
</body>
</html>
