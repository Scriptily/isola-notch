# Pull requests when a dependency has an update or a security fix: the NuGet
# packages, and the actions the workflows use (pinned to commit hashes, which
# Dependabot keeps current).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
