name: Release

# Publishes a version: push a tag "vX.Y.Z" (VERSION and CHANGELOG.md updated
# first), or run this by hand with a tag that already exists to rebuild it.
#
# The setup is built here, from the tag's own source, so anyone can see what
# went into it: the run log is public and the file gets a signed build
# attestation. Then it's scanned on VirusTotal, published with its changelog
# section, the scan and its SHA-256 as the notes, and the scan is committed
# back to CHANGELOG.md on main.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v1.0.1'
        required: true

permissions:
  contents: write        # create the release, commit the scan to CHANGELOG.md
  id-token: write        # sign the build attestation
  attestations: write
  issues: write          # the Store secret's renewal reminder

concurrency:
  group: release         # one at a time: each commits to main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Source at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: src

      # The release tooling and the changelog come from main, so a tag cut
      # before a tooling fix is still published the current way.
      - name: Tooling and changelog from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src/VERSION).Trim()
          if ("v$version" -ne $env:TAG) { throw "tag $env:TAG doesn't match VERSION $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Tests
        run: dotnet run -c Release --project src\tests\Isola.Tests.csproj

      - name: Build IsolaSetup.exe (NativeAOT)
        shell: pwsh
        working-directory: src
        run: .\build.ps1 -SkipTests

      - name: Build attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: src/dist/IsolaSetup.exe

      - name: VirusTotal scan
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          . main/tools/virustotal.ps1
          $scan = Invoke-VirusTotal (Resolve-Path src/dist/IsolaSetup.exe).Path
          Add-ScanToChangelog (Resolve-Path main/CHANGELOG.md).Path $env:VERSION $scan
          "{0} of {1} flagged  {2}" -f $scan.Flagged, $scan.Total, $scan.Link

      - name: Publish the release
        shell: pwsh
        run: |
          $log = Get-Content main/CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $sha = (Get-FileHash src/dist/IsolaSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = $m.Groups[1].Value.Trim() + "`n`n---`nDownload **IsolaSetup.exe** below and run it (per-user, no administrator rights). Isola updates itself after that.`n`nBuilt by GitHub Actions from this tag's source ([build log]($run)), with a signed build attestation: ``gh attestation verify IsolaSetup.exe --repo $env:GITHUB_REPOSITORY```n`n[Code signing policy]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/main/CODE_SIGNING_POLICY.md) · [Privacy policy]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/main/PRIVACY.md)`n`nsha256: $sha"
          Set-Content notes.md $notes -Encoding utf8
          gh release create $env:TAG src/dist/IsolaSetup.exe --repo $env:GITHUB_REPOSITORY --title "Isola $env:VERSION" --notes-file notes.md --verify-tag
          if ($LASTEXITCODE) { throw "gh release create failed" }

      - name: Commit the scan to CHANGELOG.md
        shell: pwsh
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "changelog unchanged"; exit 0 }
          git commit -m "Changelog: VirusTotal result for $env:VERSION"
          git push origin HEAD:main

      # ---- Microsoft Store: the same version, from the same tag ----------------
      # Built for every tag that has the store/ folder and kept as an artifact.
      # Submitted when the repository variable STORE_PRODUCT_ID is set, with the
      # Partner Center secrets AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID,
      # AZURE_AD_APPLICATION_SECRET and SELLER_ID (store/README.md). The Store
      # certifies it in up to three business days and updates installed copies.
      - name: Build the Microsoft Store package
        id: msix
        if: hashFiles('src/store/build-msix.ps1') != ''
        shell: pwsh
        working-directory: src
        run: |
          .\store\build-msix.ps1 -SkipTiles
          "path=$((Resolve-Path "dist\Isola-$env:VERSION.msix").Path)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.msix.outcome == 'success'
        with:
          name: Isola-${{ env.VERSION }}-msix
          path: ${{ steps.msix.outputs.path }}
          if-no-files-found: error

      # The repo variable STORE_SUBMIT=manual skips the Store steps for a while:
      # the package is still built and kept as this run's artifact, to upload
      # by hand with a listing update (a release while that submission is open
      # would delete it, or fail against one in certification).
      # Signs in first, so an expired secret fails here with the renewal steps
      # (and an issue) instead of somewhere inside msstore.
      - name: Check Partner Center access
        if: steps.msix.outcome == 'success' && vars.STORE_PRODUCT_ID != '' && vars.STORE_SUBMIT != 'manual'
        shell: pwsh
        working-directory: src
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          PRODUCT: ${{ vars.STORE_PRODUCT_ID }}
          EXPIRES: ${{ vars.STORE_SECRET_EXPIRES }}
        run: .\store\check-store-access.ps1

      - name: Set up the Microsoft Store CLI
        if: steps.msix.outcome == 'success' && vars.STORE_PRODUCT_ID != '' && vars.STORE_SUBMIT != 'manual'
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Submit to the Microsoft Store
        if: steps.msix.outcome == 'success' && vars.STORE_PRODUCT_ID != '' && vars.STORE_SUBMIT != 'manual'
        shell: pwsh
        working-directory: src
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER: ${{ secrets.SELLER_ID }}
          CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          PRODUCT: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $id = Get-Content -Raw store\identity.json | ConvertFrom-Json
          if ($id.Name -like 'Isola.Development*') { throw "store/identity.json still has the placeholder identity: copy the values from Partner Center first" }
          if (-not ($env:TENANT -and $env:SELLER -and $env:CLIENT -and $env:SECRET)) { throw "the Partner Center secrets aren't all set" }
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          if ($LASTEXITCODE) { throw "msstore reconfigure failed" }
          msstore publish "${{ steps.msix.outputs.path }}" -id $env:PRODUCT
          if ($LASTEXITCODE) { throw "msstore publish failed" }
